[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kg-navigation-rlvr"
version = "0.1.0"
description = "A tutorial on SFT and reinforcement learning with verifiable graph-navigation rewards"
requires-python = ">=3.11"
dependencies = ["rdflib==7.6.0", "pyparsing==3.2.3"]

[project.optional-dependencies]
test = ["pytest>=7.4,<9"]
eda = ["pandas>=2,<3", "networkx>=3,<4", "matplotlib>=3.7,<4", "nbformat>=5.9,<6", "nbclient>=0.5,<1", "ipykernel>=6,<7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
